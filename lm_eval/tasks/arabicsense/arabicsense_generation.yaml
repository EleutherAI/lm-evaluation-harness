task: arabicsense_generation
dataset_path: Kamyar-zeinalipour/ArabicSense-task3
output_type: generate_until
training_split: train
test_split: test
fewshot_split: train
doc_to_text: !function utils.doc_to_text_generation
doc_to_target: !function utils.doc_to_target_generation
process_results: !function utils.process_results_generation
generation_kwargs:
  until: ["\n"]
  do_sample: false
  max_gen_toks: 128
metric_list:
  - metric: chrf
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
