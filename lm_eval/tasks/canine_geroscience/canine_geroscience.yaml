task: canine_geroscience
tag:
  - canine_geroscience_tasks
dataset_path: w0lph/canine-geroscience-questions
dataset_name: v0_1
output_type: generate_until
test_split: train
description: "Answer the question about canine aging research concisely, giving the specific fact requested (a number with its unit, a short phrase, or a short list).\n\n"
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{answer.strip()}}"
process_results: !function utils.process_results
fewshot_config:
  sampler: first_n
  samples: !function utils.list_fewshot_samples
num_fewshot: 0
target_delimiter: " "
should_decontaminate: true
doc_to_decontamination_query: question
generation_kwargs:
  until:
    - "\n\n"
    - "Question:"
  max_gen_toks: 96
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
