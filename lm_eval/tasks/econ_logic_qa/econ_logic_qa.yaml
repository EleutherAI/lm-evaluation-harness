task: econ_logic_qa
dataset_path: yinzhu-quan/econ_logic_qa
output_type: generate_until
training_split: train
fewshot_split: train
validation_split: val
test_split: test
doc_to_text: !function utils.doc_to_text
doc_to_target: "{{Answer}}"
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: pairwise_accuracy
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  max_gen_toks: 64
  temperature: 0.0
  do_sample: false
  until:
    - "\n\n"
    - "Question:"
num_fewshot: 1
repeats: 1
metadata:
  version: 1.0
