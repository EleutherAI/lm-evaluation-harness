task: italian_crossword_solving
dataset_path: Kamyar-zeinalipour/Crossword-Surprisal-IT
output_type: generate_until
test_split: train
process_docs: !function utils.process_docs_solving
doc_to_text: !function utils.doc_to_text_solving
doc_to_target: solution
process_results: !function utils.process_results_solving
generation_kwargs:
  until: ["\n"]
  do_sample: false
  max_gen_toks: 16
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
