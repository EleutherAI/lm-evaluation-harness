task: essay_syntax
dataset_path: Kamyar-zeinalipour/Essay-Syntax-Instruct
output_type: generate_until
training_split: train
test_split: test
fewshot_split: train
doc_to_text: !function utils.doc_to_text
doc_to_target: feedback
generation_kwargs:
  until: ["Essay:"]
  do_sample: false
  max_gen_toks: 1024
metric_list:
  - metric: chrf
    aggregation: chrf
    higher_is_better: true
metadata:
  version: 1.0
