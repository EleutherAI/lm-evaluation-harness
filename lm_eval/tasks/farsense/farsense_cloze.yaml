task: farsense_cloze
dataset_path: Kamyar-zeinalipour/CS_Farsi
dataset_name: eval
output_type: generate_until
training_split: train
test_split: test
fewshot_split: train
process_docs: !function utils.process_cloze
doc_to_text: !function utils.doc_to_text_cloze
doc_to_target: answer
process_results: !function utils.process_results_cloze
generation_kwargs:
  until: ["\n"]
  do_sample: false
  max_gen_toks: 32
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
