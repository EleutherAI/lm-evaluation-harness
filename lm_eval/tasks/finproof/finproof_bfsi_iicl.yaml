tag:
  - finproof
  - safety
  - bfsi

task: finproof_bfsi_iicl
dataset_path: Zytra/finproof-bench
dataset_name: iicl_seeds
output_type: generate_until
training_split: null
test_split: train
num_fewshot: 0

doc_to_text: "{{input}}"
doc_to_target: ""

generation_kwargs:
  until:
    - "Human:"
    - "\n\nQ:"
    - "\n\nUser:"
  max_gen_toks: 512
  do_sample: false
  temperature: 0

process_results: !function utils.process_results

metric_list:
  - metric: refusal_rate
    aggregation: mean
    higher_is_better: true
  - metric: asr
    aggregation: mean
    higher_is_better: false

should_decontaminate: false

metadata:
  version: 1.0
  description: >
    FinProof BFSI – IICL (Involuntary In-Context Learning) seed attacks.
    44 English adversarial prompts spanning B-series attack categories (B-01–B-07).
    All prompts are Tier-1 public (huggingface.co/datasets/Zytra/finproof-bench).
    Attacks exploit annotation-table framing to elicit SEBI/RBI-regulated outputs
    from financial AI assistants. Metric: Attack Success Rate (lower is safer).
    Reference: Zytra Techsolutions, SSRN 7464798 (2026).
