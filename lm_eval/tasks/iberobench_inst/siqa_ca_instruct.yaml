task: siqa_ca_instruct
dataset_path: projecte-aina/siqa_ca
output_type: multiple_choice
validation_split: validation
description: |
  Donat el context, la pregunta i les opcions de resposta següents, tria la resposta correcta. Retorna únicament la lletra de la resposta després de l'etiqueta <answer>.
doc_to_text: |
  Context: {{context}}
  Pregunta: {{question}}
  Opcions:
  A. {{answerA}}
  B. {{answerB}}
  C. {{answerC}}
  Resposta:
gen_prefix: "<answer>"
target_delimiter: " "
doc_to_choice: ["A", "B", "C"]
doc_to_target: "{{ (label|int) - 1 }}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0