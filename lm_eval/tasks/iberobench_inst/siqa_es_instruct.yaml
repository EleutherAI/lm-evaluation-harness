task: siqa_es_instruct
dataset_path: BSC-LT/siqa_es
output_type: multiple_choice
validation_split: train
description: |
  Dado el siguiente contexto, pregunta y opciones de respuesta, elige la opción correcta. Devuelve únicamente la letra de la respuesta después de la etiqueta <answer>.
doc_to_text: |
  Contexto: {{context}}
  Pregunta: {{question}}
  Opciones:
  A. {{answer_a}}
  B. {{answer_b}}
  C. {{answer_c}}
  Respuesta:
gen_prefix: "<answer>"
target_delimiter: " "
doc_to_choice: ["A", "B", "C"]
doc_to_target: "{{ (label|int) - 1 }}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0