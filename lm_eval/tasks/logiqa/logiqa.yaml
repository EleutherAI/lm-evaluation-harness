task: logiqa
dataset_path: text
dataset_kwargs:
  data_files:
    train: https://raw.githubusercontent.com/lgw863/LogiQA-dataset/master/Train.txt
    validation: https://raw.githubusercontent.com/lgw863/LogiQA-dataset/master/Eval.txt
    test: https://raw.githubusercontent.com/lgw863/LogiQA-dataset/master/Test.txt
  sample_by: document
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: test
process_docs: !function utils_logiqa.process_docs
doc_to_choice: "{{options}}"
doc_to_text: !function utils_logiqa.doc_to_text
doc_to_target: !function utils_logiqa.doc_to_target
doc_to_decontamination_query: "{{context}}"
should_decontaminate: true
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
