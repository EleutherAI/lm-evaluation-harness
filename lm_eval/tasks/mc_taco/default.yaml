task: mc_taco
dataset_path: csv
dataset_kwargs:
  data_files:
    validation: https://raw.githubusercontent.com/CogComp/MCTACO/master/dataset/dev_3783.tsv
    test: https://raw.githubusercontent.com/CogComp/MCTACO/master/dataset/test_9442.tsv
  delimiter: "\t"
  column_names: [sentence, question, answer, label, category]
  na_filter: false
output_type: multiple_choice
validation_split: validation
test_split: test
doc_to_text: "{{sentence}}\nQuestion: {{question}}\nAnswer: {{answer}}\nPlausible:"
doc_to_target: label
doc_to_choice: ["no", "yes"]
should_decontaminate: true
doc_to_decontamination_query: "{{question}} {{sentence}}"
metric_list:
  - metric: acc
  - metric: f1
metadata:
  version: 1.0
