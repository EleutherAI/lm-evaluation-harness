task: pharmaqa_it
dataset_path: Kamyar-zeinalipour/PharmaQA.IT
output_type: generate_until
test_split: test
doc_to_text: !function utils.doc_to_text
doc_to_target: answer
process_results: !function utils.process_results
generation_kwargs:
  until: ["\n"]
  do_sample: false
  max_gen_toks: 96
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
