dataset_path: themohal/saraiki-llm-bench
test_split: test
fewshot_split: dev
fewshot_config:
  sampler: first_n
num_fewshot: 5
output_type: multiple_choice
doc_to_text: "{{question}}\n{% for o in options %}{{ 'ABCDEFGHIJ'[loop.index0] }}. {{o}}\n{% endfor %}Answer:"
doc_to_choice: "{{ ['A','B','C','D','E','F','G','H','I','J'][:options|length] }}"
doc_to_target: answer_index
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0
