task: saraiki_math
dataset_path: themohal/saraiki-llm-bench
dataset_name: math
test_split: test
fewshot_split: dev
fewshot_config:
  sampler: first_n
num_fewshot: 8
output_type: generate_until
doc_to_text: "{{question}}\nAnswer:"
doc_to_target: "{{answer_number}}"
generation_kwargs:
  until: ["\n\n"]
  do_sample: false
  max_gen_toks: 256
process_results: !function utils.process_math
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0
