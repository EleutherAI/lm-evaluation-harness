task: vera
dataset_path: DFKI-SLT/SEGData
test_split: train

doc_to_image:
  - image
doc_to_text: |
  Ich zeige dir gleich eine Aufgabe, welche aus allgemeiner Beschreibung, Frage und einem Bild besteht. Antworte auf die Frage NUR mit dem korrekten Buchstaben (A, B, C, D, ...). Gib nur den Buchstaben aus, nichts anderes.
  <image>
  Beschreibung: {{ description }}
  Frage: {{ text }}
  Antwortmöglichkeiten:
  {{ answers | join("\n") }}
  Antwort:
doc_to_target: gold_answer

output_type: generate_until
generation_kwargs:
  until:
    - "\n\n"
  max_gen_toks: 16
  temperature: 0.0
  do_sample: false

filter_list:
  - name: strict-match
    filter:
      # `gold_answer` is always a single letter, so take the first standalone
      # letter in the response. Case is normalized by the metric below.
      - function: regex
        regex_pattern: "\\b([A-Za-z])\\b"
      - function: take_first

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true

metadata:
  version: 0.1
