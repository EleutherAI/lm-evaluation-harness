    aggregation: mean
    higher_is_better: true
  - metric: acc_level_1
    aggregation: mean
    higher_is_better: true
  - metric: acc_level_2
    aggregation: mean
    higher_is_better: true
  - metric: acc_level_3
    aggregation: mean
    higher_is_better: true
  - metric: acc_level_4
    aggregation: mean
    higher_is_better: true
  - metric: acc_level_5
    aggregation: mean
    higher_is_better: true
  - metric: invalid_path
    aggregation: mean
    higher_is_better: false
