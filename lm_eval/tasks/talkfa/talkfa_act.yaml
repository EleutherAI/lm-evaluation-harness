task: talkfa_act
dataset_path: Kamyar-zeinalipour/TalkFa
dataset_name: dailydialog_fa
output_type: multiple_choice
training_split: train
validation_split: val
test_split: test
fewshot_split: train
doc_to_text: !function utils.doc_to_text_act
doc_to_choice: !function utils.doc_to_choice_act
doc_to_target: !function utils.doc_to_target_act
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: !function utils.macro_f1
    higher_is_better: true
metadata:
  version: 1.0
